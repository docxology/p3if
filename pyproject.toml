[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p3if"
version = "2.5.0"
description = "Properties, Processes, and Perspectives Inter-Framework"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "P3IF Contributors"}
]
keywords = ["framework", "meta-framework", "requirements", "analysis", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.2",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "seaborn>=0.13.0",
    "Pillow>=13.0.0",
]

[project.scripts]
p3if = "p3if.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.8",
    "pytest-asyncio>=0.21.0",
    "beautifulsoup4>=4.9.0",
    "black>=24.10",
    "ruff>=0.14,<1",
    "mypy>=1.14",
    "types-requests",
    "types-PyYAML",
]
visualization = [
    "plotly>=5.14.0",
    "kaleido>=0.2.0",
]
web = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "markdown>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/docxology/p3if"
Documentation = "https://github.com/docxology/p3if#readme"
Repository = "https://github.com/docxology/p3if"
Issues = "https://github.com/docxology/p3if/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p3if = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.ruff.lint.per-file-ignores]
# Both preregistered packet inventories commit to the exact reader bytes.
"src/p3if/citation_review_tool.py" = ["UP017", "UP045"]
"scripts/*" = ["E402", "F841", "F401"]
"website/run*.py" = ["E402", "F401"]






[dependency-groups]
dev = [
    "p3if[dev,visualization,web]",
    "build>=1.2",
    "setuptools>=61.0",
    "wheel",
]
