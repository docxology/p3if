[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Run on every core (pass -n0 to debug serially). loadgroup keeps each module that writes
# fixed repository paths on one worker, and modules sharing those paths in sequence;
# see tests/conftest.py.
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -n auto
    --dist loadgroup
markers =
    unit: Unit tests
    integration: Integration tests
    visualization: Visualization tests
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
