name: P3IF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,visualization,web]"

    - name: Run linting
      run: |
        ruff check src tests
        black --check src tests

    - name: Run type checking
      run: mypy src/p3if --ignore-missing-imports

    - name: Run tests
      run: pytest tests/ -v --cov=p3if --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # codecov/codecov-action@v7.1.1
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
