name: P3IF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes its running matrix; main runs always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and matrix keys form the required check names
  # "test (ubuntu-latest, 3.13)" and "test (ubuntu-latest, 3.14)"; keep them stable.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        version: '0.13.7'
        # Reuse downloaded wheels across runs; `uv sync --frozen` still verifies every lock hash.
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      # One locked environment (dev group = p3if[dev,visualization,web] + build) serves every
      # later step; the lock check fails if pyproject.toml and uv.lock disagree.
      run: |
        uv lock --check
        uv sync --frozen

    - name: Run linting
      run: |
        uv run --no-sync ruff check src tests
        uv run --no-sync black --check src tests

    - name: Run type checking
      run: uv run --no-sync mypy src/p3if --ignore-missing-imports

    - name: Run tests
      # pytest.ini adds `-n auto --dist loadgroup`; pytest-cov combines the worker coverage.
      run: uv run --no-sync pytest tests/ --cov=p3if --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # codecov/codecov-action@v7.1.1
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Build package
      run: uv build
